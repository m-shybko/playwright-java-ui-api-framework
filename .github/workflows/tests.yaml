name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      parallel:
        description: 'Run tests in parallel'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install system dependencies for browsers
        run: sudo ./mvnw exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps"

      - name: Install Playwright browser
        run: ./mvnw exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install ${{ inputs.browser || 'chromium' }}"

      - name: Run UI tests manually
        if: github.event_name == 'workflow_dispatch'
        run: ./mvnw clean verify -Dparallel=${{ inputs.parallel }} -Dbrowser=${{ inputs.browser }} -Dtest="com.example.playwrightdemo.ui.tests.*Tests"

      - name: Run UI tests automatically
        if: github.event_name != 'workflow_dispatch'
        run: ./mvnw clean verify -Dparallel=true -Dtest="com.example.playwrightdemo.ui.tests.*Tests"

      - name: Generate Allure report
        if: always()
        run: ./mvnw allure:report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5