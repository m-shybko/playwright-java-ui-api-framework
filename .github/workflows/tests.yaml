name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      parallelTests:
        description: 'Run tests in parallel'
        required: true
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install system dependencies for browsers
        run: sudo ./mvnw exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps"

      - name: Install Playwright browser
        run: ./mvnw exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install ${{ inputs.browser || 'chromium' }}"

      - name: Run UI tests manually
        if: github.event_name == 'workflow_dispatch'
        run: ./mvnw clean verify -DparallelTests=${{ inputs.parallelTests }} -Dbrowser=${{ inputs.browser }} -Dtest="com.example.playwrightdemo.ui.tests.*Tests"

      - name: Run UI tests automatically
        if: github.event_name != 'workflow_dispatch'
        run: ./mvnw clean verify -DparallelTests=true -Dtest="com.example.playwrightdemo.ui.tests.*Tests"

      - name: Generate Allure report
        if: always()
        run: ./mvnw allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn